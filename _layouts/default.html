<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{{ page.title }} | {{ site.title }}</title>

    <!-- Bootstrap CSS (required) -->
    <link rel="stylesheet" href="{{ '/assets/vendor/bootstrap/css/bootstrap.min.css' | relative_url }}">

    <!-- Theme CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/agency.css' | relative_url }}">

    <!-- Force navbar items to be hidden until Menu is clicked -->
    <style>
      /* Hide collapsed content until it has .show */
      .navbar-collapse.collapse:not(.show) {
        display: none !important;
      }
    </style>

    <!-- Font Awesome -->
    <script src="https://use.fontawesome.com/releases/v5.15.4/js/all.js" crossorigin="anonymous"></script>
  </head>

  <body id="page-top">
    {{ content }}

    <!-- JS: jQuery -> Bootstrap -> Theme -->
    <script src="{{ '/assets/vendor/jquery/jquery.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/vendor/bootstrap/js/bootstrap.bundle.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/agency.min.js' | relative_url }}"></script>
  </body>
</html>
