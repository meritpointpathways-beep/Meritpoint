# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole site.
# If you change this file, please redeploy the site.

# Theme
remote_theme: raviriley/agency-jekyll-theme

# Site URL settings (GitHub Pages project site)
url: "https://meritpointpathways-beep.github.io"
baseurl: "/Meritpoint"

# Site identity
title: "MeritPoint Pathways"
email: "info@meritpoint.com"
description: "Education and career guidance with step-by-step program selection, funding (OSAP) support, and career pathways."
author: "MeritPoint Pathways"

# Localization
locale: "en-US" # See available languages in _data/sitetext.yml

# Analytics
analytics:
  google: "" # Google Analytics tracking code here

# Collections
collections:
  portfolio:
    output: true

# Markdown
markdown: kramdown

# Optional: use Formspree form ID based URL instead of email-based URL
# formspree_form_path: "f/a_form_id"

# Custom CSS (theme supports loading custom CSS by name)
custom_css:
  - custom.css

# Plugins
plugins:
  - jekyll-remote-theme

