<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
  <div class="container">
    <a class="navbar-brand" href="{{ '/' | relative_url }}">
      {% if site.logo %}
        <img height="{{ site.logo.height | default: 52 }}" src="{{ site.logo.path | relative_url }}" alt="{{ site.title }}">
      {% else %}
        {{ site.title }}
      {% endif %}
    </a>

    <button class="navbar-toggler navbar-toggler-right" type="button"
      data-toggle="collapse" data-target="#navbarResponsive"
      data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
      aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
      Menu <i class="fas fa-bars ml-1"></i>
    </button>

    <div class="collapse navbar-collapse" id="navbarResponsive">
      <ul class="navbar-nav text-uppercase ml-auto">
        {% for link in site.data.navigation.nav %}
          {% if link.title %}
            <li class="nav-item">
              {% if link.section %}
                <a class="nav-link js-scroll-trigger" href="{{ '/#' | relative_url }}{{ link.section }}">{{ link.title }}</a>
              {% elsif link.url %}
                <a class="nav-link" href="{{ link.url | relative_url }}">{{ link.title }}</a>
              {% endif %}
            </li>
          {% endif %}
        {% endfor %}
      </ul>
    </div>
  </div>
</nav>
