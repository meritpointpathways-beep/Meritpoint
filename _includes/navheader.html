<nav class="navbar navbar-dark fixed-top" id="mainNav">
  <div class="container">
    <a class="navbar-brand" href="{{ '/' | relative_url }}">
      {% if site.logo %}
        <img src="{{ site.logo.path | relative_url }}" alt="{{ site.title }}">
      {% else %}
        {{ site.title }}
      {% endif %}
    </a>

    <!-- This is the hamburger button -->
    <button class="navbar-toggler" type="button"
      data-toggle="collapse" data-target="#navbarResponsive"
      data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
      aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
      Menu <i class="fas fa-bars ml-1"></i>
    </button>

    <div class="collapse navbar-collapse" id="navbarResponsive">
      <ul class="navbar-nav text-uppercase ml-auto">
        {% for link in site.data.navigation.nav %}
          <li class="nav-item">
            <a class="nav-link" href="{{ link.url | relative_url }}">{{ link.title }}</a>
          </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</nav>
