en-US:
  header:
    title: "MeritPoint Pathways"
    text: "Education and career guidance with step-by-step program planning, funding support (OSAP), and clear career roadmaps."
    button: "Book a Free Consultation"
    buttonlink: "/Meritpoint/contact/"

  services:
    title: "What We Help With"
    text: "Clear, step-by-step guidance for students, working professionals, and career changers."
    section: services
    list:
      - title: "Program & Career Planning"
        desc: "Choose the right program and build a realistic plan based on your goals, timeline, and experience."
        icon: "fas fa-route"
      - title: "Funding Guidance (OSAP)"
        desc: "Understand what may be covered and what documents you need. Eligibility varies by person and program."
        icon: "fas fa-hand-holding-usd"
      - title: "Career Pathways & Job Readiness"
        desc: "Structured career roadmaps plus practical job search direction and next steps."
        icon: "fas fa-briefcase"

  portfolio:
    title: "Career Pathways"
    text: "Browse roadmaps across Skilled Trades, Healthcare, and STEM & professional designations."
    section: portfolio
    closebutton: "Close"

  timeline:
    title: "How It Works"
    text: "A simple process from first call to next steps."
    section: timeline
    events:
      - title: "Free consultation"
        year: ""
        desc: "Share your goal and background. We clarify options and next steps."
        image: "assets/img/timeline/1.jpg"
        alt: ""
      - title: "Plan & eligibility"
        year: ""
        desc: "We review program fit and funding direction (where applicable)."
        image: "assets/img/timeline/2.jpg"
        alt: ""
      - title: "Step-by-step roadmap"
        year: ""
        desc: "You get a clear checklist, timeline, and what to do next."
        image: "assets/img/timeline/3.jpg"
        alt: ""
      - title: "Support through action"
        year: ""
        desc: "We help you move forward with applications and career progress."
        image: "assets/img/timeline/4.jpg"
        alt: ""
    end: "Start your next chapter"

  contact:
    title: "Request Information"
    text: "Book a free consultation or send a request and we’ll get back to you."
    section: contact
    name: "Full Name*"
    name-validation: "Please enter your name."
    email: "Email*"
    email-validation: "Please enter your email address."
    phone: "Phone (optional)"
    phone-validation: ""
    message: "What are you looking for? (Program / Funding / Career / Hiring)"
    message-validation: "Please add a short message."
    subject: "New website inquiry"
    submit: "Send Request"

  footer:
    legal: "Privacy Policy"
    social:
      - url: "mailto:info@meritpoint.ca"
        icon: "fas fa-envelope"
      - url: "tel:+14378823664"
        icon: "fas fa-phone"
      - url: "https://MeritPoint.ca"
        icon: "fas fa-globe"

