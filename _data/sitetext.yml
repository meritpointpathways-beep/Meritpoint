en: &DEFAULT_EN
  header:
  title: "MeritPoint Pathways"
  text: "Education funding guidance • Career pathways • Job readiness"
  button: "Book a Free Consultation"
  buttonlink: "#contact"

# SERVICES
services:
  title: "What We Help With"
  text: "Clear, step-by-step guidance for students, working professionals, and career changers—especially newcomers."
  section: services
  list:
    - title: "Program & Career Planning"
      desc: "We help you choose the right program and map a realistic career plan based on your goals, timeline, budget, and current experience."
      icon: fas fa-route
    - title: "Government Funding Guidance"
      desc: "Support understanding and applying for options like OSAP and Better Jobs Ontario (eligibility varies). We explain what can be covered—tuition, books, supplies, and sometimes living costs."
      icon: fas fa-hand-holding-usd
    - title: "Employment & Career Progression"
      desc: "Resume/LinkedIn direction, job-search strategy, and role matching based on your skill set—plus support for employers seeking job-ready talent."
      icon: fas fa-briefcase

# PORTFOLIO (the card/grid section)
portfolio:
  title: "Career Pathways Library"
  text: "Explore detailed guides across Skilled Trades, Healthcare, and STEM—plus professional designations and licensing routes."
  section: portfolio
  closebutton: "Close Guide"

