muted: "#475569"       # Muted text (optional)
link: "#D4AF37"        # Link color
button-text: "#0B1F3A" # Text on gold buttons
nav-text: "#F7F9FC"    # Text on dark navbar

# Image Customization
header-image: "../img/header-bg.jpg"
contact-image: "../img/map-image.png
