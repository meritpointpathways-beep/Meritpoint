# Color Customization
highlight: "#D4AF37"   # Gold accent (buttons, links, icons)
white: "#F7F9FC"       # Light background
black: "#0B1F3A"       # Navy (main dark)

# Extra colors (adds stronger control / prevents unreadable text)
